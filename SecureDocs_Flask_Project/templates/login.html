<!DOCTYPE html>
<html lang="en">
<head>
    <title>E-Portal Login</title>
    <style>
        body { background-color: #1a1e24; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #252a34; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        button { background: #00adb5; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>WELCOME TO E-PORTAL LOGIN</h2>
        <form method="POST">
            <select name="role">
                <option value="admin">Admin</option>
                <option value="verifier">Verifier</option>
                <option value="user">User</option>
            </select>
            <input type="text" name="username" placeholder="Username / ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
