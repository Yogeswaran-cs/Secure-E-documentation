<!DOCTYPE html>
<html>
<head>
    <title>Issue Document</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 40px; }
        .form-box { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Issue New Official Document</h2>
        <form method="POST" enctype="multipart/form-data">
            <label>Recipient User ID</label>
            <input type="text" name="recipient" placeholder="Recipient ID" required>
            <label>Select Document</label>
            <input type="file" name="file" required>
            <button type="submit">Issue Document</button>
        </form>
    </div>
</body>
</html>
